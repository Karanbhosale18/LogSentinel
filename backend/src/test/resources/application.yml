# Test profile: use an in-memory H2 database and disable seeding so the
# unit/integration tests are fast and self-contained (no PostgreSQL needed).
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173
  auth:
    username: testadmin
    password: testpass
  ai:
    provider: offline
    openai:
      api-key: ""
